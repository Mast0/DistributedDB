services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra-energy-remyha
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "Test Cluster"
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - ./data:/var/lib/cassandra
      - ./cql:/cql
